PACKAGE_NAME="proart-sdw-mtk"
PACKAGE_VERSION="1.0"
# NVIDIA's MediaTek SoundWire manager (NV-Kernels 4646b8565e0e, identical in linux-nvidia
# 7.0.0-1021 ... 1024) with patches/audio/kernel/000[1-4] applied by install-sdw-dkms.sh.
BUILT_MODULE_NAME[0]="soundwire-mtk"
BUILT_MODULE_LOCATION[0]="drivers/soundwire/mediatek"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/soundwire/mediatek modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/soundwire/mediatek clean"
# Only the kernels whose soundwire-mtk source was checked to match. A newer linux-nvidia keeps its
# own module (extend the list after comparing drivers/soundwire/mediatek).
BUILD_EXCLUSIVE_KERNEL="^7\.0\.0-102[1-4]-nvidia"
AUTOINSTALL="yes"
