# SPDX-License-Identifier: GPL-2.0-only
# ASUS ProArt P16 H7607BA (NVIDIA N1X): 2-way speaker system
#   woofers  -> 2x Cirrus CS35L56 (MT8901 DL0, UCM device "Speaker")
#   tweeters -> Cirrus CS42L43 speaker amp (MT8901 DL1 -> codec DP5, UCM device "Headphones")
# NVIDIA's UCM profile only drives the woofers; on Windows, Dolby splits the signal. This does the same:
#   virtual sink "ProArt P16 Speakers" -> tone control -> limiter -> crossover -> 4-channel combine
# Tone control (change live with proart-eq): bass, mid, presence, treble
# Tweeter branch: high-pass LR4 1.8 kHz -> high shelf from 5.5 kHz -> +9 dB -> 20.5 ms delay -> limiter (-1 dBFS)
# Woofer branch: unchanged (ASUS tuning low-passes at ~3 kHz), delayed 1 ms (= tweeter limiter lookahead).
# Timing (measured): the woofers (CS35L56 DSP) arrive 20.5 ms later acoustically -> tweeters delayed 20.5 ms.
# Remove: delete this file, then  systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "proart_2way_hw"
            node.description = "ProArt 2-way (internal)"
            combine.latency-compensate = true
            combine.props = { audio.position = [ FL FR RL RR ] }
            stream.rules = [
                {   matches = [ { node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Speaker__sink" } ]
                    actions = { create-stream = { combine.audio.position = [ FL FR ] audio.position = [ FL FR ] } }
                }
                {   matches = [ { node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Headphones__sink" } ]
                    actions = { create-stream = { combine.audio.position = [ RL RR ] audio.position = [ FL FR ] } }
                }
            ]
        }
    }
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "ProArt P16 Speakers"
            media.name = "ProArt P16 Speakers"
            filter.graph = {
                nodes = [
                    # Tone control
                    { type = builtin name = bassL label = bq_lowshelf control = { "Freq" = 300.0  "Q" = 0.7 "Gain" = 2.0 } }
                    { type = builtin name = bassR label = bq_lowshelf control = { "Freq" = 300.0  "Q" = 0.7 "Gain" = 2.0 } }
                    { type = builtin name = midL  label = bq_peaking  control = { "Freq" = 900.0  "Q" = 0.8 "Gain" = 3.0 } }
                    { type = builtin name = midR  label = bq_peaking  control = { "Freq" = 900.0  "Q" = 0.8 "Gain" = 3.0 } }
                    { type = builtin name = presL label = bq_peaking  control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
                    { type = builtin name = presR label = bq_peaking  control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
                    # Overall limiter after the tone control (no clipping from bass/mid boosts)
                    { type = lv2 name = limA plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "g_in" = 1.0 "th" = 0.891 "boost" = 0 "alr" = 0 "lk" = 1.0 } }
                    # Woofer branch
                    { type = builtin name = dL   label = delay config = { "max-delay" = 0.02 } control = { "Delay (s)" = 0.001 } }
                    { type = builtin name = dR   label = delay config = { "max-delay" = 0.02 } control = { "Delay (s)" = 0.001 } }
                    # Tweeter branch
                    { type = builtin name = hp1L label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
                    { type = builtin name = hp2L label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
                    { type = builtin name = shL  label = bq_highshelf control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = 1.0 } }
                    { type = builtin name = hp1R label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
                    { type = builtin name = hp2R label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
                    { type = builtin name = shR  label = bq_highshelf control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = 1.0 } }
                    { type = builtin name = dtL label = delay config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0205 } }
                    { type = builtin name = dtR label = delay config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0205 } }
                    { type = lv2 name = limT plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "g_in" = 2.82 "th" = 0.891 "boost" = 0 "alr" = 0 "lk" = 1.0 } }
                ]
                links = [
                    { output = "bassL:Out" input = "midL:In" }
                    { output = "midL:Out"  input = "presL:In" }
                    { output = "presL:Out" input = "limA:in_l" }
                    { output = "bassR:Out" input = "midR:In" }
                    { output = "midR:Out"  input = "presR:In" }
                    { output = "presR:Out" input = "limA:in_r" }
                    { output = "limA:out_l" input = "dL:In" }
                    { output = "limA:out_l" input = "hp1L:In" }
                    { output = "hp1L:Out" input = "hp2L:In" }
                    { output = "hp2L:Out" input = "shL:In" }
                    { output = "shL:Out"  input = "dtL:In" }
                    { output = "dtL:Out"  input = "limT:in_l" }
                    { output = "limA:out_r" input = "dR:In" }
                    { output = "limA:out_r" input = "hp1R:In" }
                    { output = "hp1R:Out" input = "hp2R:In" }
                    { output = "hp2R:Out" input = "shR:In" }
                    { output = "shR:Out"  input = "dtR:In" }
                    { output = "dtR:Out"  input = "limT:in_r" }
                ]
                inputs  = [ "bassL:In" "bassR:In" ]
                outputs = [ "dL:Out" "dR:Out" "limT:out_l" "limT:out_r" ]
            }
            capture.props = {
                node.name = "proart_speakers"
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                priority.session = 1500
            }
            playback.props = {
                node.name = "proart_speakers.crossover"
                node.passive = true
                target.object = "proart_2way_hw"
                audio.position = [ FL FR RL RR ]
                stream.dont-remix = true
            }
        }
    }
]
