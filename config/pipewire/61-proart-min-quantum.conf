# ASUS ProArt P16 H7607BA (NVIDIA N1X): the SoundWire speaker path (MT8901 DL0/DL1 behind the 2-way combine in
# 60-proart-2way.conf) cannot run at small buffers. An app asking for ~6 ms (OpenCode's attention sound,
# node.latency 300/48000) took the whole graph to 256 samples: the speakers fell into an xrun/restart loop
# (RUNNING -> SETUP/XRUN about every second; crackling, then no sound). Never below 1024 samples (21 ms).
# Live without a restart:  pw-metadata -n settings 0 clock.min-quantum 1024
# Remove: delete this file, then  systemctl --user restart pipewire pipewire-pulse wireplumber
context.properties = {
    default.clock.min-quantum = 1024
}
