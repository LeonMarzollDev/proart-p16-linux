# ASUS ProArt P16 H7607BA: readable names for the audio devices (MT8901 SoundWire, NVIDIA HDA)
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-NVDA2014_00" } ]
    actions = { update-props = { device.description = "Display Audio (HDMI/DisplayPort)" device.nick = "Display Audio" } }
  }
  {
    matches = [ { device.name = "alsa_card.platform-mtk_sdw_mc" } ]
    actions = { update-props = { device.description = "ProArt P16 Audio" device.nick = "ProArt P16 Audio" } }
  }
  {
    matches = [ { node.name = "alsa_input.platform-mtk_sdw_mc.HiFi__Mic__source" } ]
    actions = { update-props = { node.description = "ProArt P16 Microphone" node.nick = "ProArt P16 Microphone" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "ProArt P16 Headphones" node.nick = "ProArt P16 Headphones" } }
  }
  {
    # only used by the crossover (ProArt P16 Speakers)
    matches = [ { node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "ProArt P16 Woofer (internal)" node.nick = "ProArt P16 Woofer (internal)" priority.session = 100
                                 media.class = "Audio/Sink/Internal" } }
  }
]
