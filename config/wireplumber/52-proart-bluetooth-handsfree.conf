# ASUS ProArt P16: Bluetooth hands-free for a paired phone (laptop = car kit, HFP HF role).
# PipeWire's native backend handles the call and publishes it on the system bus
# (org.pipewire.Telephony); proart-phone-bridge presents it to GNOME Calls as an oFono modem.
monitor.bluez.properties = {
  bluez5.telephony-dbus-service = true
  bluez5.telephony.provide-ofono = false
  bluez5.telephony.use-system-bus = true
}
