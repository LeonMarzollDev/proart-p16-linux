# ASUS ProArt P16 H7607BA (NVIDIA N1X): the firmware's ACPI \_SB.AC0._PSR always reports "battery",
# so the NVIDIA driver applies its ACPI battery cap even on AC (nvmlDeviceGetPowerSource: BATTERY,
# clocks event reason "Reliability", GPU ~20-26 W). RMSkipACPIBattCap is the driver's own switch for
# platforms whose AC state it can't read (NVIDIA's Windows driver sets it on Surface laptops; see
# NVIDIA/open-gpu-kernel-modules PR #1468). Remove this file and reboot to undo.
options nvidia NVreg_RegistryDwords="RMSkipACPIBattCap=1"
