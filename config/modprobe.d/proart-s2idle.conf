# ASUS ProArt P16 H7607BA: proart_s2idle calls the Modern Standby _DSM of \_SB.PEPD around s2idle
# (drivers/proart-s2idle). funcs is a bit mask of _DSM functions (default 0x3f8 = all of 3-9):
#   3 display off   4 display on   5 LPS0 entry   6 LPS0 exit
#   7 Modern Standby entry   8 Modern Standby exit   9 "turn on display" hint
# Examples for narrowing down side effects (see drivers/proart-s2idle/README.md):
#   options proart_s2idle funcs=0x180   # only Modern Standby entry/exit (7/8)
#   options proart_s2idle funcs=0x018   # only display off/on (3/4)
#   options proart_s2idle enable=0      # loaded but inactive
#options proart_s2idle funcs=0x3f8 debug=1
