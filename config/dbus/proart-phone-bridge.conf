<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-2.0-only
     ASUS ProArt P16: phone calls through a paired phone. PipeWire (in the desktop session)
     publishes the phone on the system bus as org.pipewire.Telephony, and proart-phone-bridge
     presents it to GNOME Calls as org.ofono. Only the local desktop user may own these names. -->
<busconfig>
  <policy at_console="true">
    <allow own="org.ofono"/>
    <allow own="org.pipewire.Telephony"/>
    <allow send_destination="org.ofono"/>
    <allow send_destination="org.pipewire.Telephony"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ofono"/>
    <deny send_destination="org.pipewire.Telephony"/>
  </policy>
</busconfig>
