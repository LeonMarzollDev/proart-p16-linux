# NVIDIA hardware video decoding through VA-API (nvidia-vaapi-driver), see install/07-video-firefox.sh
LIBVA_DRIVER_NAME=nvidia
NVD_BACKEND=direct
# Firefox: the video decoder process (RDD) needs access to /dev/nvidia* for nvidia-vaapi-driver
MOZ_DISABLE_RDD_SANDBOX=1
