# ASUS ProArt P16 H7607BA (NVIDIA N1X): keep GNOME Shell off the efficiency cores.
# With energy-aware scheduling the compositor's main thread lands on the capacity-699 cores at
# 338-500 MHz; at 120-180 Hz (or with several monitors) dragging windows and files stutters while
# the GPU is idle. A utilization clamp of 768 places it on the 998/1024 cores and raises their clock
# whenever it has work; it costs nothing while GNOME Shell is idle. New threads inherit the clamp.
[Service]
ExecStartPost=-/usr/bin/uclampset -m 768 -a -p $MAINPID
