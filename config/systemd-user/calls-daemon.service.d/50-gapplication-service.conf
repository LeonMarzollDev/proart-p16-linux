# gnome-calls 49 has no --daemon option any more ("Unbekannte Option --daemon"): the unit failed at
# every login, so Calls never ran in the background and incoming phone calls did not ring.
# Its own autostart entry uses --gapplication-service; do the same here.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-calls --gapplication-service
