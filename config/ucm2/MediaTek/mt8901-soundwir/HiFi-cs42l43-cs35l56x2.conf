#
# RTX Spark board with CS42L43 and 2x CS35L56, all on link 1.
# PCMs: 0=DL0 carries BOTH speakers and jack, 8=UL1 capture (host PDI13
# muxes host DP7 on this board).
#
# The jack cannot use DL1 on this topology: DL1's interconnect outputs
# (I034/I035) only reach O156-O159 -> PDI5/PDI6 -> SDW1_Playback3, which
# the machine entry does not register as a backend, so opening hw:,1
# fails with EINVAL (and PipeWire ACP then drops the whole verb). The
# jack backend (SDW1_Playback0, codec DP5) is fed from host DP2 via
# PDI2, whose interconnect inputs are O150/O151 = I032/I033 = DL0 only.
# Speaker and Headphones therefore share DL0 as conflicting devices
# (ports of one sink); the amp backend (SDW1_Playback1) is fed from
# host DP3 via PDI3 / O152/O153, also from DL0.
#
# Board-validated: speakers, headphones, internal DMICs and headset
# microphone.

SectionVerb {
	EnableSequence [
		# speakers: DL0 -> O152/O153 -> PDI3 -> DP3 -> SDW1_Playback1
		cset "name='O152 I032 Switch' 1"
		cset "name='O153 I033 Switch' 1"
		cset "name='PDI3 Demux' DP3"
		# jack: DL1 -> O156/O157 -> PDI5 -> DP5 (sdw-jack-pin kernel)
		cset "name='O156 I034 Switch' 1"
		cset "name='O157 I035 Switch' 1"
		cset "name='PDI5 Demux' DP5"
		cset "name='PDI6 Demux' DP6"
		cset "name='cs42l43 Headphone L Input 1' DP5RX1"
		cset "name='cs42l43 Headphone R Input 1' DP5RX2"
		# capture: UL1 <- O020/O021 <- PDI13 <- host DP7
		cset "name='PDI13 Mux' DP7"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
		# ProArt P16 (local change): woofer amps on with the verb, not with the Speaker
		# device. The Speaker port is hidden from the sound settings (api.acp.hidden-ports
		# in config/wireplumber/51-proart-names.conf, the speakers are the 2-way sink), and
		# PipeWire never enables a hidden port. Amps at 0 dB (400): the ASUS speaker tuning
		# installed to /lib/firmware/updates/cirrus by install/03-audio.sh provides speaker
		# protection.
		cset "name='Speaker Switch' 1"
		cset "name='AMP1 Speaker Switch' 1"
		cset "name='AMP2 Speaker Switch' 1"
		cset "name='AMP1 Speaker Volume' 400"
		cset "name='AMP2 Speaker Volume' 400"
	]
	DisableSequence [
		cset "name='AMP1 Speaker Switch' 0"
		cset "name='AMP2 Speaker Switch' 0"
		cset "name='Speaker Switch' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# ProArt P16 (local changes): the comments are the names GNOME shows (card description
# empty, see config/wireplumber/51-proart-names.conf); the amps are switched by the verb.
SectionDevice."Speaker" {
	Comment "ProArt P16 Woofer (internal)"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "ProArt P16 Headphones"
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='cs42l43 Headphone Digital Volume' 229,229"
	]
	DisableSequence [
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixerElem "cs42l43 Headphone Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "ProArt P16 Microphone"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
		cset "name='cs42l43 Decimator 3 Switch' 1"
		cset "name='cs42l43 Decimator 4 Switch' 1"
		cset "name='cs42l43 Decimator 3 Volume' 176"
		cset "name='cs42l43 Decimator 4 Volume' 176"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 3 Switch' 0"
		cset "name='cs42l43 Decimator 4 Switch' 0"
		# hand the shared DP1TX inputs to the Headset device: PipeWire
		# ACP probes/switches conflicting devices in an order that can
		# run this disable after the other device's enable
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "ProArt P16 Headset Microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='cs42l43 Decimator 1 Mode' ADC"
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
		cset "name='cs42l43 Decimator 1 Switch' 1"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 1 Switch' 0"
		cset "name='Headset Mic Switch' 0"
		# hand the shared DP1TX inputs to the Mic device (see above)
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		JackControl "Headset Mic Jack"
	}
}
